name: Fix Broken Spintax and Prefixed Images

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Restore Clean Baseline If Previous Run Corrupted Fonts
        run: |
          LAST_MSG=$(git log -1 --pretty=%B)
          if echo "$LAST_MSG" | grep -q "fix(images): resolve broken image spintax"; then
            echo "Detected previous run with truncated font links. Restoring HTML baseline from HEAD~1..."
            git checkout HEAD~1 -- "*.html" "*.htm" || true
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Regression Tests
        run: |
          if [ -f .github/scripts/test_fix_broken_spintax_images.py ]; then
            python .github/scripts/test_fix_broken_spintax_images.py
          fi

      - name: Execute Broken Image Spintax & Prefix Repair Engine
        run: |
          python .github/scripts/fix_broken_spintax_images.py --root .

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . -type f \( -name "*.html" -o -name "*.htm" \) -exec git add {} +
          if git diff --staged --quiet; then
            echo "No broken images detected; working tree clean."
          else
            git commit -m "fix(images): resolve broken image spintax and preserve google fonts styling"
            git push
          fi
